version: '3.8'
services:
  ais:
    container_name: ais
    # special key for pulling in private repos
    volumes:
      - ./passyunk-gh-private.key:/root/.ssh/passyunk-gh-private.key:ro
    image: ais
    network_mode: host
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ENGINE_DB_HOST
      - ENGINE_DB_PASS
      - BLUE_ENGINE_CNAME
      - GREEN_ENGINE_CNAME
